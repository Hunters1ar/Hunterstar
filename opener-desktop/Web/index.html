<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Opener | Hunterstar</title>
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .opener-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding-top: calc(var(--space-4xl) + 2rem);
            padding-bottom: var(--space-4xl);
        }

        /* Controls Toolbar */
        .opener-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--color-surface-card);
            border: 1px solid var(--color-surface-border);
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-md);
            font-family: var(--font-mono);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--color-text-primary);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.online {
            background-color: #10a37f;
            box-shadow: 0 0 10px #10a37f;
        }

        .dot.offline {
            background-color: var(--color-accent-primary);
            box-shadow: 0 0 10px var(--color-accent-glow);
        }

        /* Search Bar */
        .search-bar {
            flex: 1;
            min-width: 260px;
            max-width: 440px;
            margin-left: auto;
        }

        .search-input {
            width: 100%;
            background: var(--color-surface-card);
            border: 1px solid var(--color-surface-border);
            color: var(--color-text-primary);
            padding: 0.75rem 1.25rem;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            border-radius: var(--radius-md);
            outline: none;
            transition: var(--transition-fast);
        }

        .search-input:focus {
            border-color: var(--color-accent-primary);
            box-shadow: 0 0 10px var(--color-accent-glow);
        }

        /* Account Grid */
        .account-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 1.75rem;
            width: 100%;
        }

        .account-card {
            background: var(--color-surface-card);
            border: 1px solid var(--color-surface-border);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            transition: all var(--transition-fast);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .account-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--color-accent-primary), transparent);
            opacity: 0.6;
        }

        .account-card:hover {
            border-color: var(--color-surface-border-hover);
            box-shadow: 0 10px 30px var(--color-shadow-medium);
            transform: translateY(-2px);
        }

        .account-card:hover::before {
            opacity: 1;
        }

        /* Account Card Header */
        .account-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--color-surface-border);
            padding-bottom: 0.85rem;
            gap: 1rem;
        }

        .account-name {
            font-family: var(--font-mono);
            font-size: 1.15rem;
            color: var(--color-text-primary);
            font-weight: 600;
            letter-spacing: 0.5px;
            word-break: break-all;
        }

        .account-badge {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--color-accent-primary);
            background: rgba(255, 59, 48, 0.08);
            border: 1px solid rgba(255, 59, 48, 0.25);
            padding: 0.25rem 0.6rem;
            border-radius: var(--radius-sm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        /* App Grid within Card */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 0.75rem;
        }

        /* App Tile Button */
        .app-card-btn {
            all: unset;
            cursor: pointer;
            background: var(--color-bg-tertiary);
            border: 1px solid var(--color-surface-border);
            border-radius: var(--radius-sm);
            padding: 0.85rem 0.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 0.45rem;
            transition: all var(--transition-fast);
            position: relative;
            user-select: none;
            box-sizing: border-box;
        }

        .app-card-btn:hover:not(:disabled) {
            transform: translateY(-4px);
            border-color: var(--color-accent-primary);
            box-shadow: 0 6px 20px var(--color-accent-glow);
            background: var(--color-bg-elevated);
        }

        .app-card-btn:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .app-card-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            filter: grayscale(0.6);
        }

        /* Favicon & Avatar Wrap */
        .app-icon-wrap {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: var(--color-surface-card);
            border: 1px solid var(--color-surface-border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }

        .app-card-btn:hover:not(:disabled) .app-icon-wrap {
            border-color: var(--color-accent-primary);
            box-shadow: 0 0 10px var(--color-accent-glow);
            transform: scale(1.05);
        }

        .app-icon-img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            border-radius: 4px;
        }

        .app-letter-avatar {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 1rem;
            color: var(--color-accent-primary);
            background: var(--color-bg-elevated);
            text-transform: uppercase;
        }

        /* Typography inside App Tile */
        .app-card-name {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--color-text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            line-height: 1.2;
        }

        .app-card-domain {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--color-text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            line-height: 1.2;
        }

        /* Launching feedback */
        .app-card-btn.launching {
            border-color: #10a37f !important;
            box-shadow: 0 0 15px rgba(16, 163, 127, 0.4) !important;
        }

        .app-card-btn.launching .app-card-name {
            color: #10a37f !important;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-fast);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-surface-border);
            border-radius: var(--radius-md);
            padding: 2rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 40px var(--color-shadow-deep);
        }

        .modal-title {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: var(--color-text-primary);
        }

        .modal-desc {
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .modal-input {
            width: 100%;
            background: var(--color-bg-tertiary);
            border: 1px solid var(--color-surface-border);
            color: var(--color-text-primary);
            padding: 0.75rem 1rem;
            font-family: var(--font-mono);
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            outline: none;
        }

        .modal-input:focus {
            border-color: var(--color-accent-primary);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .btn-modal {
            padding: 0.5rem 1.5rem;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid var(--color-text-muted);
            color: var(--color-text-primary);
        }

        .btn-cancel:hover {
            border-color: var(--color-text-primary);
        }

        .btn-submit {
            background: transparent;
            border: 1px solid var(--color-accent-primary);
            color: var(--color-accent-primary);
        }

        .btn-submit:hover {
            background: var(--color-accent-primary);
            color: #ffffff;
            box-shadow: 0 0 15px var(--color-accent-glow);
        }

        @media (max-width: 768px) {
            .account-grid {
                grid-template-columns: 1fr;
            }
            .launcher-status-bar {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
            .btn-connect {
                width: 100%;
            }
        }
    </style>
</head>
<body class="redline-page">
    <div class="grain-overlay" aria-hidden="true"></div>
    <div class="vignette-overlay" aria-hidden="true"></div>

    <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html" class="site-logo" aria-label="Hunterstar home">
            <span class="site-logo-mark" aria-hidden="true">
                <img src="assets/logo.png" alt="Hunterstar Logo" class="site-logo-image">
            </span>
            <span>Hunterstar</span>
        </a>
        <div class="site-nav-actions">
            <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <span class="sr-only">Toggle theme</span>
                <span class="icon-container">
                    <svg class="icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg class="icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </span>
            </button>
        </div>
    </nav>

    <div class="opener-container container">
        <header class="section-header" style="text-align: center; align-items: center; margin-bottom: 2rem;">
            <span class="section-number">System / Tool</span>
            <h1 class="section-title">HUNTERSTAR ACCOUNT OPENER</h1>
            <p class="section-subtitle">Open dedicated browser sessions for AI platforms.</p>
        </header>

        <!-- Controls Toolbar -->
        <div class="opener-toolbar">
            <div class="status-indicator">
                <span class="dot offline" id="launcherDot"></span>
                <span id="launcherStatusText">LAUNCHER OFFLINE</span>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="> Search accounts..." autocomplete="off">
            </div>
        </div>

        <!-- Account Grid -->
        <div class="account-grid" id="accountGrid">
            <!-- Rendered via JS -->
        </div>
    </div>

    <script>
        // All privileged operations go to the C# host. No HTTP launcher or public API.
        const pendingRequests = new Map();
        window.chrome.webview.addEventListener('message', ({ data }) => {
            const request = pendingRequests.get(data.id);
            if (!request) return;
            clearTimeout(request.timeout);
            pendingRequests.delete(data.id);
            data.ok ? request.resolve(data.result) : request.reject(new Error(data.error));
        });
        function desktopRequest(action, payload = {}) {
            return new Promise((resolve, reject) => {
                const id = crypto.randomUUID();
                const timeout = setTimeout(() => {
                    pendingRequests.delete(id);
                    reject(new Error('The desktop request timed out. Please retry.'));
                }, 35000);
                pendingRequests.set(id, { resolve, reject, timeout });
                window.chrome.webview.postMessage({ ...payload, id, action });
            });
        }
        const searchInput = document.getElementById('searchInput');
        const accountGrid = document.getElementById('accountGrid');
        const launcherDot = document.getElementById('launcherDot');
        const launcherStatusText = document.getElementById('launcherStatusText');
        const themeToggle = document.getElementById('themeToggle');
        document.documentElement.dataset.theme = localStorage.getItem('opener-theme') || 'dark';
        themeToggle.addEventListener('click', () => {
            const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = theme;
            localStorage.setItem('opener-theme', theme);
        });

        let isLauncherOnline = false;
        let accountsData = [];

        // Favicon with multi-stage fallback (Google S2 -> domain/favicon.ico -> letter avatar)
        function createFaviconElement(name, url, iconUrl) {
            let hostname = '';
            try {
                hostname = new URL(url).hostname;
            } catch {
                hostname = '';
            }

            const wrap = document.createElement('div');
            wrap.className = 'app-icon-wrap';

            const renderLetter = () => {
                wrap.innerHTML = '';
                const avatar = document.createElement('div');
                avatar.className = 'app-letter-avatar';
                avatar.textContent = (name || 'A').trim().charAt(0).toUpperCase();
                wrap.appendChild(avatar);
            };

            if (iconUrl) {
                const img = document.createElement('img');
                img.className = 'app-icon-img';
                img.alt = name;
                img.loading = 'lazy';
                img.src = iconUrl;
                img.onerror = () => {
                    if (hostname) {
                        img.onerror = () => {
                            img.onerror = () => renderLetter();
                            img.src = `https://${hostname}/favicon.ico`;
                        };
                        img.src = `https://www.google.com/s2/favicons?domain=${hostname}&sz=64`;
                    } else {
                        renderLetter();
                    }
                };
                wrap.appendChild(img);
                return wrap;
            }

            if (!hostname) {
                renderLetter();
                return wrap;
            }

            const img = document.createElement('img');
            img.className = 'app-icon-img';
            img.alt = name;
            img.loading = 'lazy';
            img.src = `https://www.google.com/s2/favicons?domain=${hostname}&sz=64`;

            img.onerror = () => {
                img.onerror = () => renderLetter();
                img.src = `https://${hostname}/favicon.ico`;
            };

            wrap.appendChild(img);
            return wrap;
        }

        // App Opening Logic
        async function openApp(profileId, name, url) {
            try {
                await desktopRequest('open', { account: profileId, url });
            } catch (err) {
                alert(`Error opening ${name}: ${err.message}`);
            }
        }

        function createAppCard(app, profileId) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'app-card-btn';
            btn.disabled = !isLauncherOnline;
            if (!isLauncherOnline) {
                btn.title = 'Google Chrome was not found. Install Chrome or set CHROME_PATH.';
            }

            // Favicon or Avatar
            const iconWrap = createFaviconElement(app.name, app.url, app.icon);
            btn.appendChild(iconWrap);

            // Name
            const nameEl = document.createElement('div');
            nameEl.className = 'app-card-name';
            nameEl.textContent = app.name || 'App';
            nameEl.title = app.name || 'App';
            btn.appendChild(nameEl);

            // Domain
            let hostname = '';
            try {
                hostname = new URL(app.url).hostname.replace(/^www\./, '');
            } catch {}
            const domainEl = document.createElement('div');
            domainEl.className = 'app-card-domain';
            domainEl.textContent = hostname || 'open link';
            domainEl.title = app.url || '';
            btn.appendChild(domainEl);

            // Click handling with launch feedback
            btn.addEventListener('click', async () => {
                if (!isLauncherOnline) return;
                btn.classList.add('launching');
                const origText = nameEl.textContent;
                nameEl.textContent = 'Launching...';
                try {
                    await openApp(profileId, app.name, app.url);
                } finally {
                    setTimeout(() => {
                        btn.classList.remove('launching');
                        nameEl.textContent = origText;
                    }, 1200);
                }
            });

            return btn;
        }

        // Search Logic
        searchInput.addEventListener('input', () => {
            renderAccounts();
        });

        // Render Cards
        function renderAccounts() {
            const filter = searchInput.value.toLowerCase().trim();
            
            const filteredAccounts = accountsData.filter(acc => 
                acc.name.toLowerCase().includes(filter)
            );

            accountGrid.innerHTML = '';

            if (filteredAccounts.length === 0) {
                accountGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--color-text-muted); font-family: var(--font-mono); padding: 2.5rem; font-size: 0.9rem;">No accounts found.</div>`;
                return;
            }

            filteredAccounts.forEach(acc => {
                const card = document.createElement('div');
                card.className = 'account-card';
                
                // Header
                const headerEl = document.createElement('div');
                headerEl.className = 'account-header';

                const nameEl = document.createElement('div');
                nameEl.className = 'account-name';
                nameEl.textContent = acc.name;
                headerEl.appendChild(nameEl);

                const apps = Array.isArray(acc.enabledApps) ? acc.enabledApps : [];
                const badgeEl = document.createElement('div');
                badgeEl.className = 'account-badge';
                badgeEl.textContent = `${apps.length} APP${apps.length === 1 ? '' : 'S'}`;
                headerEl.appendChild(badgeEl);

                card.appendChild(headerEl);

                // Apps Grid
                const appGrid = document.createElement('div');
                appGrid.className = 'app-grid';

                if (apps.length === 0) {
                    appGrid.innerHTML = `<div style="grid-column: 1/-1; color: var(--color-text-muted); font-size: 0.8rem; font-family: var(--font-mono); padding: 0.5rem 0;">No apps configured.</div>`;
                } else {
                    apps.forEach(app => {
                        const appBtn = createAppCard(app, acc.profileId);
                        appGrid.appendChild(appBtn);
                    });
                }

                card.appendChild(appGrid);
                accountGrid.appendChild(card);
            });
        }

        // Fetch Accounts
        async function fetchAccounts() {
            document.body.dataset.loadState = 'loading';
            accountGrid.textContent = 'Loading accounts from Firebase...';
            try {
                const data = await desktopRequest('accounts');
                accountsData = Array.isArray(data.accounts) ? data.accounts : [];
                renderAccounts();
                document.body.dataset.loadState = 'ready';
            } catch (err) {
                document.body.dataset.loadState = 'error';
                accountGrid.replaceChildren();
                const message = document.createElement('div');
                message.style.cssText = 'grid-column:1/-1;color:var(--color-accent-primary);font-family:var(--font-mono);padding:2rem';
                message.textContent = `Could not load Firebase accounts: ${err.message} `;
                const retry = document.createElement('button');
                retry.className = 'status-indicator';
                retry.textContent = 'Retry';
                retry.addEventListener('click', fetchAccounts);
                message.appendChild(retry);
                accountGrid.appendChild(message);
            }
        }

        // Launcher Health Check
        async function checkLauncher() {
            try {
                return (await desktopRequest('health')).online;
            } catch {
                return false;
            }
        }

        async function pollLauncher() {
            const online = await checkLauncher();
            if (online !== isLauncherOnline) {
                isLauncherOnline = online;
                if (isLauncherOnline) {
                    launcherDot.classList.remove('offline');
                    launcherDot.classList.add('online');
                    launcherStatusText.textContent = 'LAUNCHER ONLINE';
                } else {
                    launcherDot.classList.remove('online');
                    launcherDot.classList.add('offline');
                    launcherStatusText.textContent = 'CHROME NOT FOUND';
                }
                
                // Re-render to update button disabled states
                if (document.body.dataset.loadState === 'ready') renderAccounts();
            }
        }

        // Init
        window.addEventListener('DOMContentLoaded', () => {
            pollLauncher().then(fetchAccounts);
            setInterval(pollLauncher, 5000);
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'F5' || (event.ctrlKey && event.key.toLowerCase() === 'r')) {
                event.preventDefault();
                fetchAccounts();
            }
        });
        function runDesktopSmokeChecks() {
            const count = document.querySelectorAll('.account-card').length;
            searchInput.value = 'no-account-matches-this-smoke-test';
            searchInput.dispatchEvent(new Event('input'));
            const searchWorks = document.querySelectorAll('.account-card').length === 0;
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input'));
            const before = document.documentElement.dataset.theme;
            themeToggle.click();
            const themeWorks = document.documentElement.dataset.theme !== before;
            themeToggle.click();
            return { ok: searchWorks && themeWorks && count === accountsData.length && isLauncherOnline, searchWorks, themeWorks, count, launcherOnline: isLauncherOnline };
        }
    </script>
</body>
</html>
